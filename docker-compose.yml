services:
  env-dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: officelab-env-dashboard
    restart: unless-stopped
    ports:
      # host:container -- 8090/8091 were already taken on Proteus
      # (confirmed via `ss -tlnp`), so the app is exposed on 8095 instead.
      # The container still listens on 8090 internally (see PORT below).
      - "8095:8090"
    environment:
      ESP32_ENV_URL: "http://192.168.64.20/env"
      POLL_INTERVAL_SECONDS: "15"
      RETENTION_DAYS: "30"
      DB_PATH: "/data/env.db"
      PORT: "8090"
    volumes:
      - env-dashboard-data:/data

volumes:
  env-dashboard-data:
